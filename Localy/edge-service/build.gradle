plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.localy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('tomcat.version', '11.0.25')
	set('jackson-bom.version', '3.1.7')
	set('springCloudVersion', "2025.1.3")
}

// Trivy: httpcore5 >=5.4.3, bcprov >=1.85, lz4 >=1.11.4
configurations.all {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-annotations') {
			details.useVersion '2.21'
			details.because 'Jackson annotations use 2.21 (no 2.21.7 artifact)'
		} else if (details.requested.group.startsWith('com.fasterxml.jackson') && details.requested.name != 'jackson-bom') {
			details.useVersion '2.21.7'
			details.because 'Trivy Jackson 2 HIGH (Boot jackson2 / transitive)'
		}
		if (details.requested.group == 'org.apache.httpcomponents.core5') {
			details.useVersion '5.4.3'
			details.because 'Trivy CVE-2026-54399 / CVE-2026-54428'
		}
		if (details.requested.group == 'org.bouncycastle' && details.requested.name.startsWith('bcprov-')) {
			details.useVersion '1.85'
			details.because 'Trivy CVE-2026-8763 / CVE-2026-13506'
		}
		if (details.requested.group == 'org.bouncycastle' && details.requested.name.startsWith('bcpkix-')) {
			details.useVersion '1.85'
			details.because 'Trivy Bouncy Castle companion align'
		}
		if (details.requested.group == 'at.yawk.lz4' && details.requested.name == 'lz4-java') {
			details.useVersion '1.11.4'
			details.because 'Trivy CVE-2026-106451'
		}
		if (details.requested.group == 'org.lz4' && details.requested.name == 'lz4-java') {
			details.useVersion '1.11.4'
			details.because 'Trivy CVE-2026-106451 (legacy coords)'
		}
	}
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.testcontainers:junit-jupiter:1.17.6'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// --- [Phase 1: Observability Injection] ---
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	implementation 'io.micrometer:micrometer-registry-prometheus'
}
