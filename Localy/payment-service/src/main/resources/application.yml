# payment-service application.yml

server:
  port: 8092
  shutdown: graceful

spring:
  config:
    import: "optional:configtree:/workspace/configtree/"
  lifecycle:
    timeout-per-shutdown-phase: 45s
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/paymentdb}
    username: ${SPRING_DATASOURCE_USERNAME:paymentuser}
    password: ${SPRING_DATASOURCE_PASSWORD:paymentpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 600000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.localy.payment_service.order.consumer.dto
        spring.json.value.default.type: com.localy.payment_service.order.consumer.dto.OrderApprovedEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  cloud:
    stream:
      bindings:
        paymentResultProducer-out-0:
          destination: payment-result
          contentType: application/json
          producer:
            useNativeEncoding: true
      kafka:
        binder:
          brokers: ${spring.kafka.bootstrap-servers}
          configuration:
            security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
            sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
            sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
            sasl.client.callback.handler.class: ${KAFKA_SASL_CALLBACK_HANDLER:}
        bindings:
          paymentResultProducer-out-0:
            producer:
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
                value.serializer: org.springframework.kafka.support.serializer.JsonSerializer
                spring.json.add.type.headers: false
    # orderApproved is consumed via @KafkaListener (not Stream function)
    function:
      definition: paymentResultProducer

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

management:
  server:
    port: 9090
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: "http://${HOST_IP:otel-agent-opentelemetry-collector.platform.svc.cluster.local}:4318/v1/traces"
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,prometheus
