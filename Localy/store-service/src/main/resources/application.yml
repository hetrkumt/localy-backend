server:
  port: 8071
  netty:
    connection-timeout: 2s
    idle-timeout: 15s
  shutdown: graceful

spring:
  config:
    import: "optional:configtree:/workspace/configtree/"
  application:
    name: store-service
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5434/storedb}
    username: ${SPRING_R2DBC_USERNAME:localyuser}
    password: ${SPRING_R2DBC_PASSWORD:localypassword}
    pool:
      max-size: 15
      initial-size: 2
      max-idle-time: 30m
      max-life-time: 10m
      validation-query: SELECT 1
  sql:
    init:
      enabled: true
      platform: postgresql
      schema-locations: classpath:schema.sql
      continue-on-error: false
      mode: always

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}
    region:
      static: ${AWS_REGION:ap-northeast-2}

management:
  server:
    port: 9090
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: "http://${HOST_IP:otel-agent-opentelemetry-collector.platform.svc.cluster.local}:4318/v1/traces"
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
