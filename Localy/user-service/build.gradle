plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.localy.userservice'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	// Trivy 2026-10: jackson 2.21.4 HIGH, spring-webmvc/webflux 6.2.19 CRITICAL (OSS fix 7.0.9), lz4 1.10.1 HIGH
	set('jackson-bom.version', '2.21.7')
	set('spring-framework.version', '7.0.9')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	// [추�?] K8s ?�존??�?관측성??Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// [추�?] 502/504 방어??Resilience4j Core & Reactor ?�동 모듈
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.0.2'
	implementation 'io.github.resilience4j:resilience4j-reactor:2.0.2'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


dependencyManagement {
	imports {
		// Trivy CRITICAL: netty-handler 4.1.136 ? Fixed 4.1.137+
		mavenBom 'io.netty:netty-bom:4.1.137.Final'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// --- [Phase 1: Observability Injection] ---
dependencies {
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.micrometer:micrometer-registry-prometheus'
}

// Trivy CVE-2026-106451: lz4-java >= 1.11.4
configurations.configureEach {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'at.yawk.lz4' && details.requested.name == 'lz4-java') {
			details.useVersion '1.11.4'
			details.because 'Trivy CVE-2026-106451'
		}
		if (details.requested.group == 'org.lz4' && details.requested.name == 'lz4-java') {
			details.useVersion '1.11.4'
			details.because 'Trivy CVE-2026-106451 (legacy coords)'
		}
	}
}