plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.localy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('tomcat.version', '11.0.25')
	set('jackson-bom.version', '3.1.7')
	set('springCloudVersion', "2025.1.3")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.cloud:spring-cloud-starter-stream-kafka'
	// Boot 4 prefers Jackson 3; keep Jackson 2 ObjectMapper APIs via compatibility module
	implementation 'org.springframework.boot:spring-boot-jackson2'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate6'

	// AWS MSK IAM Auth (Zero-Trust Kafka)
	implementation 'software.amazon.msk:aws-msk-iam-auth:2.2.0'

	compileOnly 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	runtimeOnly 'org.postgresql:postgresql:42.7.12'

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// --- [Phase 1: Observability Injection] ---
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	// --- [Phase 1: AWS IAM DB Auth & Kafka] ---
	implementation 'software.amazon.jdbc:aws-advanced-jdbc-wrapper:2.6.5'
	implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:1.0.1'
	implementation 'org.springframework.kafka:spring-kafka'
}

// Trivy CVE-2026-106451: lz4-java >= 1.11.4
configurations.configureEach {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group.startsWith('com.fasterxml.jackson')) {
			details.useVersion '2.21.7'
			details.because 'Trivy Jackson 2 HIGH'
		}
		if (details.requested.group == 'at.yawk.lz4' && details.requested.name == 'lz4-java') {
			details.useVersion '1.11.4'
			details.because 'Trivy CVE-2026-106451'
		}
		if (details.requested.group == 'org.lz4' && details.requested.name == 'lz4-java') {
			details.useVersion '1.11.4'
			details.because 'Trivy CVE-2026-106451 (legacy coords)'
		}
	}
}
